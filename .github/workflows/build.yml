name: Build docs

# Build-only verification (PR + main). No GitHub Pages deploy — intentional for this fork.
# Uses documentation-actions reusable-docs-ci (not legacy reusable-docusaurus-test-deploy).
# LFS is on: all LFS objects download again (they 404'd here historically),
# so the build uses real images instead of pointer files.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-docs-ci.yml@v2
    with:
      working-directory: .
      cache-dependency-path: package-lock.json
      node-version: '24'
      run-build: true
      lfs: true
      annotate-log: true
    secrets: inherit
