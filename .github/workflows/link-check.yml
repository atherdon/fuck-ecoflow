name: Link check
on:
  pull_request:
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - '.github/workflows/link-check.yml'
      - '.lychee.toml'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
jobs:
  lychee:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-link-check.yml@v1
    with:
      args: >-
        --verbose
        --no-progress
        --max-concurrency 8
        --accept 200,204,206,403,429
        --timeout 20
        --exclude-path node_modules
        --exclude-path build
        --exclude-path .git
        --exclude-path abs-dont-look-here
        README.md
        CHANGELOG.md
        'docs/**/*.md'
      create-issue: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    secrets: inherit
