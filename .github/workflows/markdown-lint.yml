name: Markdown lint
on:
  pull_request:
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - '.markdownlint.json'
      - '.github/workflows/markdown-lint.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'AGENTS.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - '.markdownlint.json'
jobs:
  markdownlint:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-markdownlint.yml@v1
    with:
      globs: |
        README.md
        CHANGELOG.md
        AGENTS.md
        CONTRIBUTING.md
        docs/**/*.md
        !node_modules/**
        !build/**
        !abs-dont-look-here/**
