name: Naming conventions

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check-naming-conventions.mjs'
      - 'package.json'
      - '.github/workflows/naming-conventions.yml'

jobs:
  docs-paths:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-npm-script-check.yml@v1
    with:
      working-directory: .
      cache-dependency-path: package-lock.json
      node-version: '24'
      lfs: true
      job-name: Check docs path names
      run-command: npm run check:naming -- --base "origin/${{ github.base_ref }}" --head HEAD
