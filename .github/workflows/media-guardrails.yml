name: Media guardrails

on:
  pull_request:
    paths:
      - '**/*.avif'
      - '**/*.gif'
      - '**/*.jpeg'
      - '**/*.jpg'
      - '**/*.mov'
      - '**/*.mp4'
      - '**/*.png'
      - '**/*.webp'
      - 'scripts/check-media-guardrails.mjs'
      - 'package.json'
      - '.github/workflows/media-guardrails.yml'

jobs:
  media:
    name: Check media additions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check media guardrails
        run: npm run check:media -- --base "origin/${{ github.base_ref }}" --head HEAD
