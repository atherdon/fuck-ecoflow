name: Media guardrails

on:
  pull_request:
    paths:
      - '**/*.avif'
      - '**/*.gif'
      - '**/*.jpeg'
      - '**/*.jpg'
      - '**/*.mov'
      - '**/*.mp4'
      - '**/*.png'
      - '**/*.webp'
      - 'scripts/check-media-guardrails.mjs'
      - 'package.json'
      - '.github/workflows/media-guardrails.yml'

jobs:
  media:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-npm-script-check.yml@v1
    with:
      working-directory: .
      cache-dependency-path: package-lock.json
      node-version: '24'
      lfs: true
      job-name: Check media additions
      run-command: npm run check:media -- --base "origin/${{ github.base_ref }}" --head HEAD
